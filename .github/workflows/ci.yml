name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── goapp：Linux 上编译 + 测试 ────────────────────────────
  goapp-test:
    name: goapp / test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum

      - name: go vet
        working-directory: goapp
        run: go vet ./...

      - name: go test
        working-directory: goapp
        run: go test ./...

  # ── NetHelper：Windows 上编译 + conntrack 单元测试 ────────
  nethelper-test:
    name: NetHelper / test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: NetHelper/go.mod
          cache-dependency-path: NetHelper/go.sum

      - name: go vet
        working-directory: NetHelper
        run: go vet ./...

      - name: go test (conntrack)
        working-directory: NetHelper
        run: go test ./internal/conntrack/... -v -timeout 30s

      - name: go build
        working-directory: NetHelper
        run: go build ./...
