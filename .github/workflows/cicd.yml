name: CI/CD

# ─────────────────────────────────────────────────────────────
# 触发规则：
#   push main  → check + test + sync-wiki + bump-and-tag
#   push tag   → check + test + build + release
#   PR         → check + test
#   手动触发   → check + test + build + release（需填写 tag）
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布的 tag（如 v1.2.3）'
        required: false
        type: string

permissions:
  contents: write
  actions:  write

env:
  # 统一的 tag 名：手动输入 > push tag > ref_name
  TAG_NAME: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
  # 是否处于"发布模式"（push tag 或 手动带 tag）
  IS_RELEASE: >-
    ${{ startsWith(github.ref, 'refs/tags/v')
        || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. 文本完整性检查（所有事件）
  # ════════════════════════════════════════════════════════════
  check:
    name: ✅ text-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate text integrity
        run: sh ./scripts/check_text_integrity.sh --all

  # ════════════════════════════════════════════════════════════
  # 2. 测试（所有事件，并行跑两个平台）
  # ════════════════════════════════════════════════════════════
  test-goapp:
    name: 🧪 test / goapp (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum

      - run: go vet ./...
        working-directory: goapp

      - run: go test ./...
        working-directory: goapp

  test-nethelper:
    name: 🧪 test / NetHelper (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: NetHelper/go.mod
          cache-dependency-path: NetHelper/go.sum

      - run: go vet ./...
        working-directory: NetHelper

      - run: go test ./internal/conntrack/... -v -timeout 30s
        working-directory: NetHelper

      - run: go build ./...
        working-directory: NetHelper

  # ════════════════════════════════════════════════════════════
  # 3. 同步 wiki（push main 时，wiki/ 目录有变更）
  # ════════════════════════════════════════════════════════════
  sync-wiki:
    name: 📖 sync-wiki
    runs-on: ubuntu-latest
    # 仅在 push main 时运行（非 tag、非 PR、非 bot 推送的 wiki 更新亦可）
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check if wiki/ changed
        id: wiki-changed
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$SHA" | grep -q "^wiki/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to GitHub Wiki
        if: steps.wiki-changed.outputs.changed == 'true'
        run: |
          git clone \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki \
            || { echo "Wiki repo not found. Please create the first Wiki page on GitHub UI."; exit 1; }

          find /tmp/wiki -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r wiki/* /tmp/wiki/

          cd /tmp/wiki
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: auto-sync wiki from main [skip ci]"
          git push origin master

  # ════════════════════════════════════════════════════════════
  # 4. 自动 bump VERSION + 打 tag（push main，非 bot，测试通过后）
  # ════════════════════════════════════════════════════════════
  bump-and-tag:
    name: 🔖 bump-version + tag
    runs-on: ubuntu-latest
    needs: [check, test-goapp, test-nethelper]
    # 非 bot、非 tag 事件的 push main 才执行
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.actor != 'github-actions[bot]'
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump VERSION patch
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          [[ -f VERSION ]] || { echo "VERSION file not found"; exit 1; }

          current="$(tr -d ' \t\r\n' < VERSION)"
          current="${current#v}"
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "VERSION must be x.y.z, got: $current"; exit 1; }

          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          next="${major}.${minor}.${patch}"
          printf "%s\n" "$next" > VERSION
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Commit VERSION & push tag
        id: publish
        shell: bash
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION
          if git diff --cached --quiet; then
            echo "No VERSION change, skip."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: bump VERSION to ${NEXT}"
          git push origin HEAD:main

          TAG="v${NEXT#v}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Tag already exists: ${TAG}"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════
  # 5. 构建 goapp（push tag 或 workflow_dispatch，测试通过后）
  # ════════════════════════════════════════════════════════════
  build-goapp:
    name: 🔨 build / goapp / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [check, test-goapp, test-nethelper]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum

      - name: Build server + probe
        working-directory: goapp
        env:
          CGO_ENABLED: '0'
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          SRV="dist/vpshelper_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          PRB="dist/vpsprobe_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          LDFLAGS="-s -w -X vpshelper-go/internal/version.Version=${TAG_NAME}"
          go build -trimpath -ldflags "$LDFLAGS" -o "$SRV" ./cmd/server
          go build -trimpath -ldflags "$LDFLAGS" -o "$PRB" ./cmd/probe

      - uses: actions/upload-artifact@v4
        with:
          name: goapp_${{ matrix.goos }}_${{ matrix.goarch }}
          path: goapp/dist/*
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════
  # 6. 构建 NetHelper GUI（Wails，windows-latest）
  # ════════════════════════════════════════════════════════════
  build-nethelper:
    name: 🔨 build / NetHelper GUI (windows)
    runs-on: windows-latest
    needs: [check, test-goapp, test-nethelper]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: NetHelper/go.mod
          cache-dependency-path: NetHelper/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app
        # wails build 内部自动执行 wails.json 的 frontend:install + frontend:build
        working-directory: NetHelper
        run: wails build -ldflags "-s -w"

      - uses: actions/upload-artifact@v4
        with:
          name: nethelper_windows_amd64
          path: NetHelper/build/bin/NetHelper.exe
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════
  # 7. 发布 Release
  # ════════════════════════════════════════════════════════════
  release:
    name: 🚀 publish release
    runs-on: ubuntu-latest
    needs: [build-goapp, build-nethelper]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lR dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:              ${{ env.TAG_NAME }}
          name:                  ${{ env.TAG_NAME }}
          generate_release_notes: true
          overwrite_files:       true
          files:                 dist/*
