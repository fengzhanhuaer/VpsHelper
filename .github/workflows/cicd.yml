name: CI/CD

# ─────────────────────────────────────────────────────────────
# 触发规则：
#   push main  → check + test + build + release（单次触发，不再监听 tag push）
#   PR         → check + test
#   手动触发   → check + test + build + release
#
# ⚠️ 不监听 tag push：避免 release job 推 tag 时再次触发 CI，
#   防止 Go build cache 污染导致编译出旧版本产物。
# ─────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '手动发布的 tag（如 v1.2.3）'
        required: false
        type: string

permissions:
  contents: write
  actions:  write

jobs:
  # ════════════════════════════════════════════════════════════
  # 1. 前置步骤：文本检查与版本推导
  # ════════════════════════════════════════════════════════════
  check:
    name: ✅ check & determine-version
    runs-on: ubuntu-latest
    outputs:
      tag_name:   ${{ steps.version.outputs.tag_name }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate text integrity
        run: |
          sh ./scripts/check_text_integrity.sh --all

      - name: Determine Version
        id: version
        run: |
          INPUT_TAG="${{ inputs.tag }}"

          if [[ -n "$INPUT_TAG" ]]; then
            # 手动触发，使用指定 tag
            BASE_TAG="$INPUT_TAG"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # push main：读 VERSION 文件，patch +1
            current="$(tr -d ' \t\r\n' < VERSION)"
            current="${current#v}"
            IFS='.' read -r major minor patch <<< "$current"
            patch=$((patch + 1))
            BASE_TAG="v${major}.${minor}.${patch}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            # PR 或其他情况：不发 release
            BASE_TAG="dev-${{ github.sha }}"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Determined Version: $BASE_TAG"
          echo "tag_name=$BASE_TAG" >> "$GITHUB_OUTPUT"

  # ════════════════════════════════════════════════════════════
  # 2. 并行阶段：后端测试、前端构建、后端构建同时开跑
  # ════════════════════════════════════════════════════════════
  test-goapp:
    name: 🧪 test / goapp (linux)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum
      - run: go vet ./...
        working-directory: goapp
      - run: go test ./...
        working-directory: goapp

  test-nethelper:
    name: 🧪 test / NetHelper (windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: NetHelper/go.mod
          cache-dependency-path: NetHelper/go.sum
      - name: Mock frontend for go embed
        working-directory: NetHelper
        run: |
          mkdir -p frontend/dist
          echo "mock" > frontend/dist/index.html
      - run: go vet ./...
        working-directory: NetHelper
      - run: go test ./internal/conntrack/... -v -timeout 30s
        working-directory: NetHelper
      - run: go build ./...
        working-directory: NetHelper

  build-goapp:
    name: 🔨 build / goapp / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [check]
    if: needs.check.outputs.is_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum
          # 禁用 Go build cache：防止旧版 binary 被缓存还原导致产出旧代码
          # module 下载缓存保留（由 cache-dependency-path 控制）
          cache: false
      - name: Verify build commit
        run: |
          echo "Building from: $(git rev-parse HEAD)  $(git log -1 --format='%ai %s')"
      - name: Build server + probe
        working-directory: goapp
        env:
          CGO_ENABLED: '0'
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          TAG_NAME:    ${{ needs.check.outputs.tag_name }}
        run: |
          mkdir -p dist
          SRV="dist/vpshelper_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          PRB="dist/vpsprobe_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          LDFLAGS="-s -w -X vpshelper-go/internal/version.Version=${TAG_NAME}"
          # -a: 强制全量重编译，绕过所有编译缓存
          go build -trimpath -a -ldflags "$LDFLAGS" -o "$SRV" ./cmd/server
          go build -trimpath -a -ldflags "$LDFLAGS" -o "$PRB" ./cmd/probe
      - uses: actions/upload-artifact@v4
        with:
          name: goapp_${{ matrix.goos }}_${{ matrix.goarch }}
          path: goapp/dist/*
          if-no-files-found: error

  build-nethelper:
    name: 🔨 build / NetHelper GUI (windows)
    runs-on: windows-latest
    needs: [check]
    if: needs.check.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: NetHelper/go.mod
          cache-dependency-path: NetHelper/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Wails app
        working-directory: NetHelper
        run: |
          wails build -ldflags "-s -w -X NetHelper/internal/version.Version=${{ needs.check.outputs.tag_name }}"
          Rename-Item -Path "build\bin\NetHelper.exe" -NewName "nethelper_windows_amd64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: nethelper_windows_amd64
          path: NetHelper/build/bin/nethelper_windows_amd64.exe
          if-no-files-found: error

  # ════════════════════════════════════════════════════════════
  # 3. 异步附属任务：同步 wiki（push main 时）
  # ════════════════════════════════════════════════════════════
  sync-wiki:
    name: 📖 sync-wiki
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if wiki/ changed
        id: wiki-changed
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$SHA" | grep -q "^wiki/"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to GitHub Wiki
        if: steps.wiki-changed.outputs.changed == 'true'
        run: |
          git clone \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" \
            /tmp/wiki || exit 1
          find /tmp/wiki -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r wiki/* /tmp/wiki/
          cd /tmp/wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "docs: auto-sync wiki from main [skip ci]"
          git push origin master

  # ════════════════════════════════════════════════════════════
  # 4. 发布阶段：汇聚所有并行产物，创建 Release，最后 bump VERSION
  # ════════════════════════════════════════════════════════════
  release:
    name: 🚀 publish release
    runs-on: ubuntu-latest
    needs: [check, test-goapp, test-nethelper, build-goapp, build-nethelper]
    if: needs.check.outputs.is_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Tag & Publish Release
        id: publisher
        env:
          TAG: ${{ needs.check.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing release: $TAG"

          # 打 tag 到当前触发 commit（触发代码的那个 commit，不是 VERSION bump commit）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag created: $TAG"
          else
            echo "Tag already exists: $TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:               ${{ needs.check.outputs.tag_name }}
          name:                   ${{ needs.check.outputs.tag_name }}
          generate_release_notes: true
          overwrite_files:        true
          files:                  dist/*

      - name: Bump VERSION and push
        # 最后才 bump VERSION，确保 tag 永远打在"触发本次构建的 commit"上，
        # 而不是 VERSION bump commit。[skip ci] 防止再次触发 CI。
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ needs.check.outputs.tag_name }}
        run: |
          NEXT="${TAG#v}"
          echo "$NEXT" > VERSION

          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump VERSION to ${NEXT} [skip ci]"
            git push origin HEAD:main
          fi
