name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Test
        working-directory: goapp
        run: go test ./...

      - name: Build
        working-directory: goapp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X vpshelper-go/internal/version.Version=${{ github.ref_name }}" -o "dist/vpshelper_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/server

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            goapp/dist/*
