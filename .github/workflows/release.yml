name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3). Optional; defaults to current ref name.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          if [[ "${TAG_NAME}" != v* ]]; then
            echo "TAG_NAME must start with 'v' (current: ${TAG_NAME})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum

      - name: Test
        working-directory: goapp
        run: go test ./...

      - name: Build All Architectures
        working-directory: goapp
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          
          echo "Building linux/amd64..."
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X vpshelper-go/internal/version.Version=${{ env.TAG_NAME }}" -o "dist/vpshelper_linux_amd64" ./cmd/server
          
          echo "Building linux/arm64..."
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X vpshelper-go/internal/version.Version=${{ env.TAG_NAME }}" -o "dist/vpshelper_linux_arm64" ./cmd/server
          
          echo "Building windows/amd64..."
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X vpshelper-go/internal/version.Version=${{ env.TAG_NAME }}" -o "dist/vpshelper_windows_amd64.exe" ./cmd/server

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          overwrite_files: true
          files: goapp/dist/*
