name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3). Optional; defaults to current ref name.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'

    steps:
      - name: Validate tag
        run: |
          if [[ "${TAG_NAME}" != v* ]]; then
            echo "TAG_NAME must start with 'v' (current: ${TAG_NAME})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum

      - name: Test
        working-directory: goapp
        run: go test ./...

      - name: Build
        working-directory: goapp
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X vpshelper-go/internal/version.Version=${{ env.TAG_NAME }}" -o "dist/vpshelper_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}" ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpshelper-${{ matrix.goos }}-${{ matrix.goarch }}
          path: goapp/dist/vpshelper_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    env:
      TAG_NAME: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vpshelper-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lah dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/*
