name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3). Optional; defaults to current ref name.'
        required: false
        type: string

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

jobs:
  # ── 1. 校验 tag 格式 ───────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - id: tag
        run: echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate tag
        run: |
          if [[ "${TAG_NAME}" != v* ]]; then
            echo "TAG_NAME must start with 'v' (current: ${TAG_NAME})."
            exit 1
          fi

  # ── 2. 测试（goapp on Linux + NetHelper conntrack on Windows）─
  test:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: goapp
            runner: ubuntu-latest
            dir: goapp
            mod: goapp/go.mod
            sum: goapp/go.sum
            cmd: go test ./...
          - name: nethelper-conntrack
            runner: windows-latest
            dir: NetHelper
            mod: NetHelper/go.mod
            sum: NetHelper/go.sum
            cmd: go test ./internal/conntrack/... -v -timeout 30s
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.mod }}
          cache-dependency-path: ${{ matrix.sum }}

      - name: Test
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}

  # ── 3. goapp 多平台构建（server + probe）─────────────────────
  build-goapp:
    name: build / goapp / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: goapp/go.mod
          cache-dependency-path: goapp/go.sum

      - name: Build
        working-directory: goapp
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          SRV_OUT="dist/vpshelper_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          PRB_OUT="dist/vpsprobe_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X vpshelper-go/internal/version.Version=${TAG_NAME}" \
            -o "${SRV_OUT}" ./cmd/server
          go build -trimpath \
            -ldflags "-s -w -X vpshelper-go/internal/version.Version=${TAG_NAME}" \
            -o "${PRB_OUT}" ./cmd/probe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: goapp_${{ matrix.goos }}_${{ matrix.goarch }}
          path: goapp/dist/*
          if-no-files-found: error

  # ── 4. NetHelper GUI 构建（Wails，windows-latest）─────────────
  build-nethelper:
    name: build / NetHelper GUI (windows)
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: NetHelper/go.mod
          cache-dependency-path: NetHelper/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails app
        # wails build 内部会自动执行 wails.json 中配置的 frontend:install + frontend:build
        working-directory: NetHelper
        run: wails build -ldflags "-s -w"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nethelper_windows_amd64
          path: NetHelper/build/bin/NetHelper.exe
          if-no-files-found: error

  # ── 5. 发布 Release ──────────────────────────────────────────
  release:
    name: publish release
    runs-on: ubuntu-latest
    needs:
      - validate
      - test
      - build-goapp
      - build-nethelper
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lR dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          name: ${{ needs.validate.outputs.tag_name }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/*
