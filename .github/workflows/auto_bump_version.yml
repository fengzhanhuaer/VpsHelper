name: auto-bump-version

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  bump:
    # Avoid infinite loop when this workflow pushes VERSION commit.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump VERSION patch
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "VERSION file not found"
            exit 1
          fi

          current="$(tr -d ' \t\r\n' < VERSION)"
          current="${current#v}"

          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be numeric semver (x.y.z), got: $current"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          next="${major}.${minor}.${patch}"

          printf "%s\n" "$next" > VERSION
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Commit and push VERSION
        id: publish
        shell: bash
        env:
          NEXT: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION
          if git diff --cached --quiet; then
            echo "No VERSION change to commit"
            exit 0
          fi

          git commit -m "chore: bump VERSION to ${NEXT}"
          git push origin HEAD:main

          TAG="v${NEXT#v}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}$"; then
            echo "Tag already exists: ${TAG}"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Dispatch release workflow
        if: ${{ steps.publish.outputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/release.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"tag\":\"${TAG}\"}}"
