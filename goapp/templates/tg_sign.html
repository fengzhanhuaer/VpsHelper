<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/tg_helper">杩斿洖Tg鍔╂墜</a>
            <a class="ghost" href="/home">杩斿洖涓昏彍鍗?/a>
            <a class="ghost" href="/logout">閫€鍑虹櫥褰?/a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>绛惧埌浠诲姟</h1>
            <p class="muted">涓烘瘡涓处鍙蜂繚瀛樹竴鏉＄鍒伴厤缃紙鐩爣 + 娑堟伅锛夈€傚彲鎵嬪姩"绔嬪嵆鎵ц"銆?/p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            {{ if .AutoLast }}
            <p class="muted" style="white-space:pre-wrap; margin-top:10px;">鏈€杩戣嚜鍔ㄧ鍒帮細
{{ .AutoLast }}</p>
            {{ end }}

            <form method="get" action="/tg/sign" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
                <div class="field" style="min-width:320px;">
                    <label for="account_id">閫夋嫨璐﹀彿</label>
                    <select id="account_id" name="account_id">
                        {{ range .Accounts }}
                          <option value="{{ .ID }}" {{ if eq $.AccountID .ID }}selected{{ end }}>{{ .ID }} - {{ .AccountName }}</option>
                        {{ end }}
                    </select>
                </div>
                <button class="ghost" type="submit">鍒囨崲</button>
            </form>

            <form method="post" action="/tg/sign" style="margin-top:10px;">
                <input type="hidden" name="account_id" value="{{ .AccountID }}" />

                {{ if .Dialogs }}
                <div class="field">
                    <label for="dialog_pick">浠庝細璇濆垪琛ㄩ€夋嫨鐩爣锛堝彲閫夛級</label>
                    <select id="dialog_pick" name="dialog_pick">
                        <option value="">锛堜笉閫夋嫨锛屾墜鍔ㄥ～鍐欎笅鏂圭洰鏍囷級</option>
                        {{ range .Dialogs }}
                          <option value="{{ .DialogID }}" {{ if eq $.DialogID .DialogID }}selected{{ end }}>{{ .Title }} ({{ .DialogID }})</option>
                        {{ end }}
                    </select>
                    <div class="muted">濡傚垪琛ㄤ负绌猴紝璇峰厛鍒?浼氳瘽鍒楄〃"椤甸潰鐐瑰嚮鍒锋柊銆?/div>
                </div>
                {{ end }}

                <div class="field">
                    <label for="dialog_id">鐩爣锛堜細璇滻D锛屾敮鎸?@username 鎴?t.me/username 鑷姩杞崲锛?/label>
                    <input id="dialog_id" name="dialog_id" value="{{ .DialogID }}" placeholder="-100xxxxxxxxxx 鎴?@mychannel" />
                </div>

                <div class="field">
                    <label for="msg">娑堟伅鍐呭锛堝彲绌猴級</label>
                    <textarea id="msg" name="msg" rows="3" placeholder="渚嬪锛氱鍒?>{{ .SignMessage }}</textarea>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn" type="submit" name="action" value="save">淇濆瓨</button>
                    <button class="ghost" type="submit" name="action" value="run">绔嬪嵆鎵ц</button>
                    <button class="ghost" type="submit" name="action" value="delete" onclick="return confirm('纭畾鍒犻櫎璇ヨ处鍙风殑绛惧埌浠诲姟鍚楋紵');">鍒犻櫎</button>
                </div>

                {{ if .CreatedAt }}
                <p class="muted" style="margin-top:12px;">涓婃淇濆瓨鏃堕棿锛歿{ .CreatedAt }}</p>
                {{ end }}
            </form>
        </section>
    </main>
</body>
</html>
