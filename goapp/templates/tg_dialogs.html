<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        .progress-card { display:none; margin-top:10px; padding:12px; border-radius:12px; border:1px solid #ecd7cb; background:#fff8f3; }
        .progress-bar { width:100%; height:8px; border-radius:999px; background:#f1dfd2; overflow:hidden; margin:6px 0 4px; }
        .progress-fill { height:100%; width:0; background:linear-gradient(90deg,#ff9f66 0%,#d9480f 100%); transition:width 0.3s ease; }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/tg_helper">返回 Tg 助手</a>
            <a class="ghost" href="/home">返回主页</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>会话列表</h1>
            <p class="muted">会话列表保存的是可发送目标的会话ID。若历史任务仍使用 @username，刷新后会自动迁移为会话ID。</p>

            <div id="page-msg-area">
            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:4px;">
                <!-- Account selector — GET, no stream -->
                <form method="get" action="/tg/dialogs" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
                    <div class="field" style="min-width:280px; margin-bottom:0;">
                        <label for="account_id">选择账号</label>
                        <select id="account_id" name="account_id">
                            {{ range .Accounts }}
                              <option value="{{ .ID }}" {{ if eq $.AccountID .ID }}selected{{ end }}>{{ .ID }} - {{ .AccountName }}</option>
                            {{ end }}
                        </select>
                    </div>
                    <button class="ghost" type="submit">切换</button>
                </form>

                <!-- Refresh button — triggers SSE stream -->
                <button id="dialogs-refresh-btn" class="btn" type="button">刷新会话列表</button>
            </div>

            <!-- Inline progress card -->
            <div id="dialogs-progress-card" class="progress-card">
                <div id="dialogs-progress-text" class="muted">准备中...</div>
                <div class="progress-bar"><div id="dialogs-progress-fill" class="progress-fill"></div></div>
                <div id="dialogs-progress-pct" class="muted" style="font-size:11px;">0%</div>
            </div>

            <table id="dialogs-table" style="margin-top:12px;">
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>username</th>
                        <th>会话ID</th>
                        <th>更新时间</th>
                    </tr>
                </thead>
                <tbody id="dialogs-tbody">
                {{ range .Dialogs }}
                    <tr>
                        <td>{{ .Title }}</td>
                        <td>{{ .Username }}</td>
                        <td><code>{{ .DialogID }}</code></td>
                        <td class="muted">{{ .UpdatedAt }}</td>
                    </tr>
                {{ else }}
                    <tr><td colspan="4" class="muted">暂无数据（先刷新）</td></tr>
                {{ end }}
                </tbody>
            </table>
        </section>
    </main>

    <script>
    (function () {
        var btn      = document.getElementById('dialogs-refresh-btn');
        var card     = document.getElementById('dialogs-progress-card');
        var textEl   = document.getElementById('dialogs-progress-text');
        var fillEl   = document.getElementById('dialogs-progress-fill');
        var pctEl    = document.getElementById('dialogs-progress-pct');
        var tbody    = document.getElementById('dialogs-tbody');
        var msgArea  = document.getElementById('page-msg-area');
        var accountSel = document.getElementById('account_id');

        function setProgress(pct, msg) {
            var p = Math.max(0, Math.min(100, Number(pct) || 0));
            fillEl.style.width = p + '%';
            pctEl.textContent  = p + '%';
            if (msg) textEl.textContent = msg;
        }

        function showMsg(text, ok) {
            msgArea.innerHTML = '<div class="' + (ok ? 'success' : 'error') + '">' + escHtml(text) + '</div>';
        }

        function escHtml(s) {
            return String(s)
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // After a successful refresh, reload the table rows via GET JSON.
        async function reloadTable(accountID) {
            try {
                var res = await fetch('/tg/dialogs?account_id=' + accountID + '&_json=1', {
                    credentials: 'same-origin'
                });
                // If server doesn't support JSON endpoint, fall back to full reload.
                if (!res.ok) { window.location.reload(); return; }
                var ct = res.headers.get('Content-Type') || '';
                if (!ct.includes('json')) { window.location.reload(); return; }
                var data = await res.json();
                renderRows(data.dialogs || []);
            } catch (_) {
                window.location.reload();
            }
        }

        function renderRows(dialogs) {
            if (!dialogs || dialogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="muted">暂无数据（先刷新）</td></tr>';
                return;
            }
            var html = '';
            dialogs.forEach(function (d) {
                html += '<tr>'
                    + '<td>' + escHtml(d.Title || '') + '</td>'
                    + '<td>' + escHtml(d.Username || '') + '</td>'
                    + '<td><code>' + escHtml(d.DialogID || '') + '</code></td>'
                    + '<td class="muted">' + escHtml(d.UpdatedAt || '') + '</td>'
                    + '</tr>';
            });
            tbody.innerHTML = html;
        }

        btn.addEventListener('click', async function () {
            var accountID = accountSel ? accountSel.value : '0';
            card.style.display = 'block';
            setProgress(0, '准备刷新...');
            msgArea.innerHTML = '';
            btn.disabled = true;
            btn.textContent = '刷新中...';

            var fd = new FormData();
            fd.set('account_id', accountID);

            try {
                var res = await fetch('/tg/dialogs/refresh/stream', {
                    method: 'POST',
                    body: fd,
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/x-ndjson' }
                });
                if (!res.ok || !res.body) throw new Error('请求失败（HTTP ' + res.status + '）');

                var reader  = res.body.getReader();
                var decoder = new TextDecoder();
                var buffer  = '';
                var lastEv  = null;

                while (true) {
                    var part = await reader.read();
                    if (part.done) break;
                    buffer += decoder.decode(part.value, { stream: true });
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (var i = 0; i < lines.length; i++) {
                        var row = lines[i].trim();
                        if (!row) continue;
                        var ev;
                        try { ev = JSON.parse(row); } catch (_) { continue; }
                        setProgress(ev.percent, ev.message);
                        lastEv = ev;
                        if (ev.done) break;
                    }
                    if (lastEv && lastEv.done) break;
                }

                if (lastEv && lastEv.ok) {
                    showMsg(lastEv.message, true);
                    setProgress(100, lastEv.message);
                    // Reload table without full page refresh.
                    await reloadTable(accountID);
                } else if (lastEv) {
                    showMsg(lastEv.message, false);
                } else {
                    showMsg('刷新结束，请刷新页面确认结果。', false);
                }
            } catch (err) {
                showMsg(err && err.message ? err.message : '请求出错', false);
                setProgress(0, '出错');
            } finally {
                btn.disabled = false;
                btn.textContent = '刷新会话列表';
                // Hide progress card after 2s
                setTimeout(function () { card.style.display = 'none'; }, 2000);
            }
        });
    })();
    </script>
</body>
</html>
