<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/tg_helper">返回 Tg 助手</a>
            <a class="ghost" href="/home">返回主页</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>会话列表</h1>
            <p class="muted">会话列表保存的是可发送目标的会话ID。若历史任务仍使用 @username，刷新后会自动迁移为会话ID。</p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            <form method="get" action="/tg/dialogs" style="display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
                <div class="field" style="min-width:320px;">
                    <label for="account_id">选择账号</label>
                    <select id="account_id" name="account_id">
                        {{ range .Accounts }}
                          <option value="{{ .ID }}" {{ if eq $.AccountID .ID }}selected{{ end }}>{{ .ID }} - {{ .AccountName }}</option>
                        {{ end }}
                    </select>
                </div>
                <button class="ghost" type="submit">切换</button>
            </form>

            <form id="dialogs-refresh-form" method="post" action="/tg/dialogs" style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <input type="hidden" name="account_id" value="{{ .AccountID }}" />
                <input type="hidden" name="action" value="refresh" />
                <button id="dialogs-refresh-btn" class="btn" type="submit">刷新会话列表</button>
                <span id="dialogs-refresh-status" class="muted" style="display:none;">正在刷新会话列表，可能需要 10-120 秒，请勿重复点击。</span>
            </form>

            <table style="margin-top:12px;">
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>username</th>
                        <th>会话ID</th>
                        <th>更新时间</th>
                    </tr>
                </thead>
                <tbody>
                {{ range .Dialogs }}
                    <tr>
                        <td>{{ .Title }}</td>
                        <td>{{ .Username }}</td>
                        <td><code>{{ .DialogID }}</code></td>
                        <td class="muted">{{ .UpdatedAt }}</td>
                    </tr>
                {{ else }}
                    <tr><td colspan="4" class="muted">暂无数据（先刷新）</td></tr>
                {{ end }}
                </tbody>
            </table>
        </section>
    </main>

    <script>
    (function () {
        var form = document.getElementById('dialogs-refresh-form');
        var btn = document.getElementById('dialogs-refresh-btn');
        var status = document.getElementById('dialogs-refresh-status');
        if (!form || !btn || !status) return;
        form.addEventListener('submit', function (event) {
            if (form.dataset.submitting === '1') {
                event.preventDefault();
                return;
            }
            form.dataset.submitting = '1';
            btn.textContent = '刷新中...';
            status.style.display = 'inline';
        });
    })();
    </script>
</body>
</html>
