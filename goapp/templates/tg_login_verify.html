<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="btn" href="/tg_helper">返回</a>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h1>验证码验证</h1>
            <p class="muted">验证码已发送到 {{ .Phone }}。</p>
            {{ if .Error }}
            <div class="error">{{ .Error }}</div>
            {{ end }}
            <form method="post">
                <input type="hidden" name="flow_id" value="{{ .FlowID }}" />
                <div class="field">
                    <label for="code">验证码</label>
                    <input id="code" name="code" required />
                </div>
                <div class="field">
                    <label for="password">两步验证密码（如有）</label>
                    <input id="password" name="password" type="password" />
                </div>
                <button class="btn" type="submit">确认登录</button>
            </form>
        </section>
    </main>
</body>
</html>
