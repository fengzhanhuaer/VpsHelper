<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
    <style>
        /* page-specific: terminal */
        #terminal { background:#111; color:#e2e8f0; font-family:"Courier New",Courier,monospace; font-size:13px; padding:12px; border-radius:10px; min-height:160px; max-height:400px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; }
        #cmd-input { font-family:"Courier New",Courier,monospace; font-size:14px; flex:1; }
        #cmd-bar { display:flex; gap:8px; margin-top:10px; }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>Shell 交互</h1>
            <p class="muted">输入 Shell 命令并在此查看输出（基于服务器执行）。</p>

            <div id="terminal"></div>

            <div id="cmd-bar">
                <input id="cmd-input" class="field" style="margin:0;" type="text" placeholder="输入 Shell 命令" autocomplete="off" autofocus />
                <button class="btn" id="run-btn" type="button">执行</button>
                <button class="ghost" id="clear-btn" type="button">清空</button>
            </div>

            <div style="margin-top: 16px;">
                <h3 style="font-size: 15px; margin: 0 0 8px;">快捷命令</h3>
                <div id="shortcut-list" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px;">
                    {{ range .Shortcuts }}
                    <button class="ghost shortcut-btn" data-cmd="{{ .Command }}" title="{{ .Command }}" style="position:relative; padding-right:30px;">
                        {{ .Name }}
                        <span class="del-shortcut" data-id="{{ .ID }}" title="删除" style="position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#9b1c1c; font-size:14px; padding:0 2px; line-height:1;">✕</span>
                    </button>
                    {{ else }}
                    <span class="muted">暂无快捷命令</span>
                    {{ end }}
                </div>

                <form id="add-shortcut-form" style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;">
                    <div class="field" style="margin:0; flex:1; min-width:160px;">
                        <label for="sc-name">名称</label>
                        <input id="sc-name" name="name" placeholder="例如：查看内存" required />
                    </div>
                    <div class="field" style="margin:0; flex:2; min-width:200px;">
                        <label for="sc-cmd">命令</label>
                        <input id="sc-cmd" name="command" placeholder="例如：free -h" required />
                    </div>
                    <button class="ghost" type="submit">添加快捷命令</button>
                </form>
            </div>
        </section>
    </main>

    <script id="history-data" type="application/json">{{ .HistoryJSON }}</script>
    <script>
        var terminal = document.getElementById('terminal');
        var cmdInput = document.getElementById('cmd-input');
        var runBtn = document.getElementById('run-btn');
        var clearBtn = document.getElementById('clear-btn');
        var cmdHistory = [];
        var histIdx = -1;
        
        try {
            var histEl = document.getElementById('history-data');
            if (histEl) cmdHistory = JSON.parse(histEl.textContent) || [];
        } catch(e) {}

        function appendLine(text) {
            terminal.textContent += text;
            terminal.scrollTop = terminal.scrollHeight;
        }
        appendLine('等待命令...\n');



        function runCommand(cmd) {
            if (!cmd.trim()) return;
            appendLine('$ ' + cmd + '\n');
            cmdHistory.unshift(cmd);
            histIdx = -1;
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/shell/exec', true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onload = function() {
                try {
                    var data = JSON.parse(xhr.responseText);
                    appendLine((data.output || '') + '\n');
                } catch (e) {
                    appendLine('[解析错误] ' + e.message + '\n');
                }
            };
            xhr.onerror = function() {
                appendLine('[网络错误] 请求失败\n');
            };
            xhr.send('command=' + encodeURIComponent(cmd));
        }


        runBtn.addEventListener('click', function () {
            var cmd = cmdInput.value;
            cmdInput.value = '';
            runCommand(cmd);
        });

        cmdInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var cmd = cmdInput.value;
                cmdInput.value = '';
                runCommand(cmd);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (histIdx < cmdHistory.length - 1) {
                    histIdx += 1;
                    cmdInput.value = cmdHistory[histIdx];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (histIdx > 0) {
                    histIdx -= 1;
                    cmdInput.value = cmdHistory[histIdx];
                } else {
                    histIdx = -1;
                    cmdInput.value = '';
                }
            }
        });

        clearBtn.addEventListener('click', function () {
            terminal.textContent = '';
        });

        document.querySelectorAll('.shortcut-btn').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                if (e.target && e.target.classList.contains('del-shortcut')) return;
                runCommand(btn.dataset.cmd);
            });
        });

        document.getElementById('add-shortcut-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            var name = document.getElementById('sc-name').value;
            var cmd = document.getElementById('sc-cmd').value;
            if (!name || !cmd) return;
            try {
                const resp = await fetch('/shell/shortcuts/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'name=' + encodeURIComponent(name) + '&command=' + encodeURIComponent(cmd)
                });
                const data = await resp.json();
                if (data.ok) location.reload();
                else alert(data.message || '添加失败');
            } catch(e) { alert('网络错误: ' + e.message); }
        });

        document.querySelectorAll('.del-shortcut').forEach(function (btn) {
            btn.addEventListener('click', async function(e) {
                e.stopPropagation();
                if (!confirm('删除快捷命令？')) return;
                try {
                    const resp = await fetch('/shell/shortcuts/delete/' + btn.dataset.id, { method: 'POST' });
                    const data = await resp.json();
                    if (data.ok) location.reload();
                    else alert(data.message || '删除失败');
                } catch(e) { alert('网络错误: ' + e.message); }
            });
        });
    </script>
</body>
</html>
