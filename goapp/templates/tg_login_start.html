<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="btn" href="/tg_helper">返回</a>
        </nav>
    </header>
    <main>
        <section class="panel panel--center">
            <h1>Telegram 登录</h1>
            <p class="muted">输入手机号以接收验证码。</p>
            {{ if .Error }}
            <div class="error">{{ .Error }}</div>
            {{ end }}
            <form method="post">
                <div class="field">
                    <label for="phone">手机号</label>
                    <input id="phone" name="phone" value="{{ .Phone }}" placeholder="+8613812345678" required />
                </div>
                <div class="field">
                    <label for="account_name">账号备注（可选）</label>
                    <input id="account_name" name="account_name" value="{{ .AccountName }}" placeholder="工作号" />
                </div>
                <button class="btn" type="submit">发送验证码</button>
            </form>
        </section>
    </main>
</body>
</html>
