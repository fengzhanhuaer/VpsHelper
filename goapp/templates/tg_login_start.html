<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f2ee;
            --panel: #ffffff;
            --ink: #1f1b16;
            --accent: #d9480f;
        }
        body {
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #fff2e6 0%, #f5f2ee 50%, #efe7df 100%);
            color: var(--ink);
        }
        header {
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        main {
            padding: 24px 32px 48px;
            max-width: 680px;
            margin: 0 auto;
        }
        .panel {
            background: var(--panel);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(31, 27, 22, 0.08);
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 12px;
        }
        .field input {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .error {
            background: #ffe3e3;
            color: #9b1c1c;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .muted {
            color: #5e4f42;
        }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="btn" href="/tg_helper">返回</a>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h1>Telegram 登录</h1>
            <p class="muted">输入手机号以接收验证码。</p>
            {{ if .Error }}
            <div class="error">{{ .Error }}</div>
            {{ end }}
            <form method="post">
                <div class="field">
                    <label for="phone">手机号</label>
                    <input id="phone" name="phone" value="{{ .Phone }}" placeholder="+8613812345678" required />
                </div>
                <div class="field">
                    <label for="account_name">账号备注（可选）</label>
                    <input id="account_name" name="account_name" value="{{ .AccountName }}" placeholder="工作号" />
                </div>
                <button class="btn" type="submit">发送验证码</button>
            </form>
        </section>
    </main>
</body>
</html>
