<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/system/settings">⚙️ 系统设置</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>
    <main>
        <section class="panel panel--wide">
            <h1>欢迎，{{ .Username }}</h1>
            <p class="muted">VpsHelper - 选择您需要的功能模块</p>
            <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px;">
                <a class="ghost" href="/ai/assistant" target="_blank" style="display:block; text-align:center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-decoration: none; transition: transform 0.2s;">🤖 AI 助手</a>
                <a class="ghost" href="/tg_helper" target="_blank" style="display:block; text-align:center;">🤖 Tg助手</a>
                <a class="ghost" href="/settings/ssh" target="_blank" style="display:block; text-align:center;">🔐 SSH设置</a>
                <a class="ghost" href="/server/status" target="_blank" style="display:block; text-align:center;">🖥 服务器状态</a>
                <a class="ghost" href="/shell" target="_blank" style="display:block; text-align:center;">⌨️ Shell交互</a>
                <a class="ghost" href="/firewall" target="_blank" style="display:block; text-align:center;">🛡 防火墙</a>
                <a class="ghost" href="/cloudflare" target="_blank" style="display:block; text-align:center;">☁️ Cloudflare</a>
                <a class="ghost" href="/probe/nodes" target="_blank" style="display:block; text-align:center;">🛰 探针管理</a>
                <a class="ghost" href="/probe/dashboard" target="_blank" style="display:block; text-align:center;">📊 探针监视</a>
                <a class="ghost" href="/system/log" target="_blank" style="display:block; text-align:center;">📄 运行日志</a>
            </div>
        </section>
    </main>
</body>
</html>
