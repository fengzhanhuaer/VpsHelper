<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f2ee;
            --panel: #ffffff;
            --ink: #1f1b16;
            --accent: #d9480f;
        }
        body {
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #fff2e6 0%, #f5f2ee 50%, #efe7df 100%);
            color: var(--ink);
        }
        header {
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        main {
            padding: 24px 32px 48px;
            max-width: 980px;
            margin: 0 auto;
        }
        .panel {
            background: var(--panel);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(31, 27, 22, 0.08);
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        .muted {
            color: #5e4f42;
        }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="btn" href="/home">返回主菜单</a>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h1>TgHelper</h1>
            <p class="muted">Telegram 登录与任务管理。</p>
            {{ if .Configured }}
            <p class="muted">API 已配置，可以继续接入登录与会话。</p>
            {{ else }}
            <p class="muted">请先配置 Telegram API ID 与 Hash。</p>
            {{ end }}
            <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                <a class="btn" href="/tg/settings">API 设置</a>
                <a class="btn" href="/tg/proxy">代理设置</a>
                <a class="btn" href="/tg/login/start">账号登录</a>
                <a class="btn" href="/tg/accounts">账号管理</a>
                <a class="btn" href="/tg/dialogs">会话列表</a>
                <a class="btn" href="/tg/auto/send">自动发送</a>
                <a class="btn" href="/tg/auto/reply">自动回复</a>
            </div>
        </section>
    </main>
</body>
</html>
