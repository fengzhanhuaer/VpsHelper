<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="btn" href="/home">返回主菜单</a>
        </nav>
    </header>
    <main>
        <section class="panel panel--wide">
            <h1>TgHelper</h1>
            <p class="muted">Telegram 登录与任务管理。</p>
            {{ if .Configured }}
            <p class="muted">API 已配置，可以继续接入登录与会话。</p>
            {{ else }}
            <p class="muted">请先配置 Telegram API ID 与 Hash。</p>
            {{ end }}
            <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                <a class="btn" href="/tg/settings">API 设置</a>
                <a class="btn" href="/tg/proxy">代理设置</a>
                <a class="btn" href="/tg/login/start">账号登录</a>
                <a class="btn" href="/tg/accounts">账号管理</a>
                <a class="btn" href="/tg/dialogs">会话列表</a>
                <a class="btn" href="/tg/auto/send">自动发送</a>
                <a class="btn" href="/tg/auto/reply">自动回复</a>
            </div>
        </section>
    </main>
</body>
</html>
