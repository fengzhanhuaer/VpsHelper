<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <style>
        :root { color-scheme: light; --panel:#fff; --ink:#1f1b16; --accent:#d9480f; }
        body { margin:0; font-family:"IBM Plex Sans","Segoe UI",sans-serif; background: radial-gradient(circle at top left, #fff2e6 0%, #f5f2ee 50%, #efe7df 100%); color: var(--ink); }
        header { padding:24px 32px; display:flex; align-items:center; justify-content:space-between; }
        main { padding:24px 32px 48px; max-width:680px; margin:0 auto; }
        .panel { background:var(--panel); padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(31,27,22,0.08); }
        .btn { display:inline-block; padding:10px 18px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; border:none; cursor:pointer; }
        .ghost { display:inline-block; padding:10px 18px; border-radius:999px; background:transparent; color:var(--ink); text-decoration:none; font-weight:600; border:1px solid #ddd; cursor:pointer; }
        .field { display:grid; gap:6px; margin-bottom:12px; }
        .field input { padding:10px 12px; border-radius:10px; border:1px solid #ddd; }
        .error { background:#ffe3e3; color:#9b1c1c; padding:10px 12px; border-radius:10px; margin-bottom:12px; }
        .success { background:#d3f9d8; color:#2b8a3e; padding:10px 12px; border-radius:10px; margin-bottom:12px; font-weight:600; }
        .muted { color:#5e4f42; }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav style="display:flex; gap:10px;">
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>
    <main>
        <section class="panel">
            <h1>修改密码</h1>
            <p class="muted">当前用户：{{ .Username }}</p>
            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}
            <form method="post" action="/change_password">
                <div class="field">
                    <label for="old_password">旧密码</label>
                    <input id="old_password" name="old_password" type="password" required />
                </div>
                <div class="field">
                    <label for="new_password">新密码</label>
                    <input id="new_password" name="new_password" type="password" required />
                </div>
                <div class="field">
                    <label for="confirm_password">确认新密码</label>
                    <input id="confirm_password" name="confirm_password" type="password" required />
                </div>
                <button class="btn" type="submit">保存新密码</button>
            </form>
        </section>
    </main>
</body>
</html>
