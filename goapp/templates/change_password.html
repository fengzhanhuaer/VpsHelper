<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/home">杩斿洖涓昏彍鍗?/a>
            <a class="ghost" href="/logout">閫€鍑虹櫥褰?/a>
        </nav>
    </header>
    <main>
        <section class="panel panel--center">
            <h1>淇敼瀵嗙爜</h1>
            <p class="muted">褰撳墠鐢ㄦ埛锛歿{ .Username }}</p>
            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

                <div class="field">
                    <label for="old_password">鏃у瘑鐮?/label>
                    <input id="old_password" name="old_password" type="password" required />
                </div>
                <div class="field">
                    <label for="new_password">鏂板瘑鐮?/label>
                    <input id="new_password" name="new_password" type="password" required />
                </div>
                <div class="field">
                    <label for="confirm_password">纭鏂板瘑鐮?/label>
                    <input id="confirm_password" name="confirm_password" type="password" required />
                </div>
                <button class="btn" type="submit">淇濆瓨鏂板瘑鐮?/button>
            </form>
        </section>
    </main>
</body>
</html>
