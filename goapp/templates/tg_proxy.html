<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/tg_helper">返回Tg助手</a>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>代理设置（Telegram）</h1>
            <p class="muted">该设置会写入本地数据库，并在 TG 登录/任务发送时作为 ALL_PROXY 生效（socks5/http 取决于你的 URL）。</p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            <form method="post" action="/tg/proxy" style="display:grid; gap:8px;">
                <div class="field">
                    <label for="all_proxy">ALL_PROXY</label>
                    <input id="all_proxy" name="all_proxy" value="{{ .AllProxy }}" placeholder="socks5://user:pass@127.0.0.1:1080" />
                    <div class="muted">示例：socks5://127.0.0.1:1080 或 http://127.0.0.1:7890</div>
                </div>

                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button class="btn" type="submit" name="action" value="save">保存</button>
                    <button class="ghost" type="submit" name="action" value="clear">清空</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
