<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="btn" href="/">Home</a>
        </nav>
    </header>
    <main>
        <section class="panel panel--center">
            <h1>鐢ㄦ埛鐧诲綍</h1>
            <p class="muted">璇疯緭鍏ヨ处鍙峰拰瀵嗙爜鐧诲綍銆?/p>
            {{ if .Error }}
            <div class="error">{{ .Error }}</div>
            {{ end }}
            <form method="post">
                <div class="field">
                    <label for="username">鐢ㄦ埛鍚?/label>
                    <input id="username" name="username" required />
                </div>
                <div class="field">
                    <label for="password">瀵嗙爜</label>
                    <input id="password" name="password" type="password" required />
                </div>
                <button class="btn" type="submit">鐧诲綍</button>
            </form>
            <div class="link">娌℃湁璐﹀彿锛?a href="/register">鍘绘敞鍐?/a></div>
        </section>
    </main>
</body>
</html>
