<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
    <style>
        .layout-container {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 16px;
        }
        .sidebar {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar a {
            display: block;
            padding: 12px 16px;
            background: var(--color-bg-alt);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            text-decoration: none;
            color: var(--color-text);
            font-weight: bold;
            transition: all 0.2s;
        }
        .sidebar a:hover {
             border-color: var(--color-primary);
        }
        .sidebar a.active {
            background: var(--color-primary);
            color: #fff;
            border-color: var(--color-primary);
        }
        .content-frame {
            flex: 1;
            border: none;
            background: transparent;
            min-height: 80vh;
        }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/probe/nodes" style="color:var(--color-primary); font-weight:bold;">探针管理</a>
            <a class="ghost" href="/probe/dashboard">探针监视</a>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>
    
    <main class="layout-container">
        <div class="sidebar">
            <a href="/probe/nodes/list" target="probe_frame" id="tab-list" class="active" onclick="switchTab('tab-list')">节点管理</a>
            <a href="/probe/nodes/comm" target="probe_frame" id="tab-comm" onclick="switchTab('tab-comm')">节点通讯</a>
            <a href="/probe/nodes/tasks" target="probe_frame" id="tab-tasks" onclick="switchTab('tab-tasks')">网络监视</a>
        </div>
        <iframe name="probe_frame" src="/probe/nodes/list" class="content-frame" onload="resizeIframe(this)"></iframe>
    </main>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function resizeIframe(obj) {
            try {
                const frameBody = obj.contentWindow.document.body;
                if(frameBody) {
                    obj.style.height = (frameBody.scrollHeight + 50) + 'px';
                }
            } catch(e) {}
        }
        window.setInterval(function() {
            var iframe = document.querySelector('iframe[name="probe_frame"]');
            if (iframe) {
                 resizeIframe(iframe);
            }
        }, 1000);
    </script>
</body>
</html>
