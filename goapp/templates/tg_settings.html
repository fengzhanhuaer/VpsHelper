<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/tg_helper">返回</a>
        </nav>
    </header>
    <main>
        <section class="panel panel--center">
            <h1>Telegram API 设置</h1>
            <p class="muted">填写 Telegram API ID 与 Hash，用于 MTProto 登录。</p>
            {{ if .Error }}
            <div class="error">{{ .Error }}</div>
            {{ end }}
            <form method="post">
                <div class="field">
                    <label for="api_id">API ID</label>
                    <input id="api_id" name="api_id" value="{{ .ApiID }}" required />
                </div>
                <div class="field">
                    <label for="api_hash">API Hash</label>
                    <input id="api_hash" name="api_hash" value="{{ .ApiHash }}" required />
                </div>
                <button class="btn" type="submit">保存</button>
            </form>
        </section>
    </main>
</body>
</html>
