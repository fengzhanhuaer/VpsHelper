<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
    <style>
        .ai-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            gap: 1rem;
        }

        .ai-config {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 0.75rem;
            align-items: flex-end;
            padding: 1rem;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .ai-config label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .ai-config input,
        .ai-config select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .ai-config input:focus,
        .ai-config select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .ai-config button {
            padding: 0.5rem 1.5rem;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .ai-config button:hover {
            background: #0052a3;
        }

        .ai-config button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .ai-chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .ai-messages {
            flex: 1;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .ai-message {
            display: flex;
            gap: 0.5rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-avatar {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .message-user {
            background: #0066cc;
            color: white;
        }

        .message-ai {
            background: #e8f0ff;
            color: #0066cc;
        }

        .message-content {
            flex: 1;
            padding: 0.75rem;
            background: #f5f5f5;
            border-radius: 6px;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .message-ai .message-content {
            background: #e8f0ff;
            color: #333;
        }

        .message-user .message-content {
            background: #0066cc;
            color: white;
        }

        .message-time {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.25rem;
        }

        .ai-input-area {
            display: flex;
            gap: 0.75rem;
        }

        .ai-input-area textarea {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            min-height: 80px;
        }

        .ai-input-area textarea:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .ai-send-button {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .ai-send-button button {
            padding: 0.75rem 1.5rem;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
            min-width: 100px;
        }

        .ai-send-button button:hover:not(:disabled) {
            background: #0052a3;
        }

        .ai-send-button button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .ai-clear-button {
            background: #999 !important;
        }

        .ai-clear-button:hover:not(:disabled) {
            background: #777 !important;
        }

        .error-message {
            color: #d32f2f;
            padding: 1rem;
            background: #ffebee;
            border-radius: 4px;
            border-left: 4px solid #d32f2f;
        }

        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .system-prompt-section {
            display: none;
        }

        .system-prompt-section.show {
            display: block;
        }

        .system-prompt-toggle {
            font-size: 0.85rem;
            color: #0066cc;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 0.5rem;
        }

        @media (max-width: 1200px) {
            .ai-config {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .ai-config {
                grid-template-columns: 1fr;
            }

            .ai-input-area {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/home">🏠 主页</a>
            <a class="ghost" href="/system/settings">⚙️ 系统设置</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>
    <main>
        <section class="panel panel--wide">
            <h1>🤖 AI 助手</h1>
            <p class="muted">使用 Google Gemini 进行对话</p>

            <div class="ai-container">
                <!-- Configuration Section -->
                <div class="ai-config">
                    <div>
                        <label for="api-key">API Key:</label>
                        <input
                            type="password"
                            id="api-key"
                            placeholder="输入您的 Google AI Studio API Key"
                            title="API Key 仅在本次会话中保存，不会被存储"
                        />
                    </div>
                    <div>
                        <label for="model-select">选择模型:</label>
                        <select id="model-select">
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash (最快)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (最强)</option>
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash (均衡)</option>
                        </select>
                    </div>
                    <div id="system-prompt-container" style="display: none;">
                        <label for="system-prompt">系统提示:</label>
                        <input
                            type="text"
                            id="system-prompt"
                            placeholder="例如: 你是一个技术顾问..."
                        />
                    </div>
                    <div>
                        <button id="toggle-system-prompt" type="button">
                            🔧 高级选项
                        </button>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="ai-chat-area">
                    <div class="ai-messages" id="messages"></div>

                    <div class="ai-input-area">
                        <textarea
                            id="message-input"
                            placeholder="输入您的问题或消息... (Shift+Enter 换行, Enter 发送)"
                        ></textarea>
                        <div class="ai-send-button">
                            <button id="send-btn" type="button">
                                📤 发送
                            </button>
                            <button id="clear-btn" class="ai-clear-button" type="button">
                                🗑 清空
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const apiKeyInput = document.getElementById("api-key");
        const modelSelect = document.getElementById("model-select");
        const systemPromptInput = document.getElementById("system-prompt");
        const toggleSystemPromptBtn = document.getElementById("toggle-system-prompt");
        const systemPromptContainer = document.getElementById("system-prompt-container");
        const messageInput = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-btn");
        const clearBtn = document.getElementById("clear-btn");
        const messagesDiv = document.getElementById("messages");

        let isLoading = false;

        // Toggle system prompt visibility
        toggleSystemPromptBtn.addEventListener("click", () => {
            systemPromptContainer.style.display =
                systemPromptContainer.style.display === "none" ? "block" : "none";
            toggleSystemPromptBtn.textContent =
                systemPromptContainer.style.display === "none"
                    ? "🔧 高级选项"
                    : "🔧 隐藏选项";
        });

        // Send message
        sendBtn.addEventListener("click", sendMessage);

        // Handle Enter key (send) and Shift+Enter (newline)
        messageInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Clear messages
        clearBtn.addEventListener("click", () => {
            if (confirm("确定要清空所有消息吗？")) {
                messagesDiv.innerHTML = "";
            }
        });

        async function sendMessage() {
            const apiKey = apiKeyInput.value.trim();
            const message = messageInput.value.trim();

            if (!apiKey) {
                showError("请输入 API Key");
                return;
            }

            if (!message) {
                showError("请输入消息");
                return;
            }

            if (isLoading) {
                return;
            }

            // Add user message to chat
            addMessage(message, "user");
            messageInput.value = "";
            isLoading = true;
            sendBtn.disabled = true;

            // Show loading indicator
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "ai-message";
            loadingDiv.innerHTML = `
                <div class="message-avatar message-ai">🤖</div>
                <div>
                    <div class="message-content">
                        <span class="loading">⏳</span> 思考中...
                    </div>
                </div>
            `;
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                const response = await fetch("/api/ai/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        model: modelSelect.value,
                        message: message,
                        system_prompt: systemPromptInput.value.trim(),
                    }),
                });

                const data = await response.json();

                // Remove loading indicator
                loadingDiv.remove();

                if (data.success) {
                    addMessage(data.message, "ai");
                } else {
                    showError(data.error || "请求失败，请检查 API Key 和网络连接");
                }
            } catch (error) {
                loadingDiv.remove();
                showError("网络错误: " + error.message);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement("div");
            messageDiv.className = "ai-message";

            const avatar = sender === "user" ? "👤" : "🤖";
            const avatarClass = sender === "user" ? "message-user" : "message-ai";
            const now = new Date();
            const timeStr = now.toLocaleTimeString("zh-CN", {
                hour: "2-digit",
                minute: "2-digit",
            });

            messageDiv.innerHTML = `
                <div class="message-avatar ${avatarClass}">${avatar}</div>
                <div>
                    <div class="message-content">${escapeHtml(text)}</div>
                    <div class="message-time">${timeStr}</div>
                </div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showError(errorText) {
            const errorDiv = document.createElement("div");
            errorDiv.className = "error-message";
            errorDiv.textContent = "❌ " + errorText;
            messagesDiv.appendChild(errorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Focus on input when page loads
        messageInput.focus();

        // Load API Key preferences from localStorage (optional)
        window.addEventListener("load", () => {
            const savedApiKey = localStorage.getItem("ai_api_key");
            const savedModel = localStorage.getItem("ai_model");
            const savedSystemPrompt = localStorage.getItem("ai_system_prompt");

            if (savedModel) modelSelect.value = savedModel;
            if (savedSystemPrompt) {
                systemPromptInput.value = savedSystemPrompt;
                systemPromptContainer.style.display = "block";
                toggleSystemPromptBtn.textContent = "🔧 隐藏选项";
            }

            // Only auto-fill API key if user explicitly saved it
            // For security, we don't auto-fill by default
        });

        // Save preferences to localStorage
        modelSelect.addEventListener("change", () => {
            localStorage.setItem("ai_model", modelSelect.value);
        });

        systemPromptInput.addEventListener("change", () => {
            localStorage.setItem("ai_system_prompt", systemPromptInput.value);
        });
    </script>
</body>
</html>
