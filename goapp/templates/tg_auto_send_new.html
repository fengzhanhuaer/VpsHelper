<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <style>
        :root { color-scheme: light; --bg:#f5f2ee; --panel:#fff; --ink:#1f1b16; --accent:#d9480f; }
        body { margin:0; font-family:"IBM Plex Sans","Segoe UI",sans-serif; background: radial-gradient(circle at top left, #fff2e6 0%, #f5f2ee 50%, #efe7df 100%); color: var(--ink); }
        header { padding:24px 32px; display:flex; align-items:center; justify-content:space-between; }
        main { padding:24px 32px 48px; max-width:980px; margin:0 auto; }
        .panel { background:var(--panel); padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(31,27,22,0.08); }
        .btn { display:inline-block; padding:10px 18px; border-radius:999px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; border:none; cursor:pointer; }
        .ghost { display:inline-block; padding:10px 18px; border-radius:999px; background:transparent; color:var(--ink); text-decoration:none; font-weight:600; border:1px solid #ddd; cursor:pointer; }
        .error { background:#ffe3e3; color:#9b1c1c; padding:10px 12px; border-radius:10px; margin:12px 0; white-space:pre-wrap; }
        .field { display:grid; gap:6px; margin-bottom:12px; }
        .field input, .field select, .field textarea { padding:10px 12px; border-radius:10px; border:1px solid #ddd; font-family: inherit; }
        .muted { color:#5e4f42; font-size:12px; }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav style="display:flex; gap:10px;">
            <a class="ghost" href="/tg/auto/send">返回任务列表</a>
            <a class="ghost" href="/tg_helper">返回Tg助手</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>新建自动发送任务</h1>
            <p class="muted">账号和会话ID均通过下拉选择。若无会话ID，请先到“会话列表”页面刷新。</p>

            {{ if .Error }}
            <div class="error">{{ .Error }}</div>
            {{ end }}

            <form method="post" action="/tg/auto/send/new" style="display:grid; gap:8px;">
                <div class="field">
                    <label for="account_id">账号</label>
                    {{ if .Accounts }}
                    <select id="account_id" name="account_id" onchange="window.location.href='/tg/auto/send/new?account_id='+this.value;">
                        {{ range .Accounts }}
                          <option value="{{ .ID }}" {{ if eq $.AccountID .ID }}selected{{ end }}>{{ .ID }} - {{ .AccountName }}</option>
                        {{ end }}
                    </select>
                    <div class="muted">切换账号会自动刷新会话ID下拉列表。</div>
                    {{ else }}
                    <div class="muted">暂无可用账号，请先在“账号登录”页面添加账号。</div>
                    {{ end }}
                </div>

                <div class="field">
                    <label for="dialog_id">会话ID</label>
                    <select id="dialog_id" name="dialog_id">
                        <option value="">请选择会话ID</option>
                        {{ range .Dialogs }}
                          <option value="{{ .DialogID }}" {{ if eq $.DialogID .DialogID }}selected{{ end }}>{{ .Title }} ({{ .DialogID }})</option>
                        {{ end }}
                    </select>
                    <div class="muted">如无可选项，请先在“会话列表”页面刷新对应账号的数据。</div>
                </div>

                <div class="field">
                    <label for="message">发送内容</label>
                    <textarea id="message" name="message" rows="5" placeholder="要发送的消息内容">{{ .Message }}</textarea>
                </div>

                <div class="field">
                    <label for="schedule_type">计划类型</label>
                    <select id="schedule_type" name="schedule_type">
                        <option value="interval" {{ if eq .ScheduleType "interval" }}selected{{ end }}>间隔（秒）</option>
                        <option value="daily" {{ if eq .ScheduleType "daily" }}selected{{ end }}>每天定时</option>
                    </select>
                </div>

                <div class="field">
                    <label for="interval_seconds">间隔秒数（interval 用）</label>
                    <input id="interval_seconds" name="interval_seconds" value="{{ .IntervalSeconds }}" placeholder="3600" />
                </div>

                <div class="field">
                    <label for="time_of_day">每日时间（daily 用，HH:MM）</label>
                    <input id="time_of_day" name="time_of_day" value="{{ .TimeOfDay }}" placeholder="03:30" />
                </div>

                <div class="field">
                    <label for="jitter_seconds">随机延时（秒）</label>
                    <input id="jitter_seconds" name="jitter_seconds" value="{{ .JitterSeconds }}" placeholder="0" />
                </div>

                <div class="field" style="display:flex; align-items:center; gap:8px;">
                    <input id="enabled" name="enabled" type="checkbox" {{ if .Enabled }}checked{{ end }} style="width:auto;" />
                    <label for="enabled" style="margin:0;">创建后立即启用</label>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn" type="submit">创建任务</button>
                    <a class="ghost" href="/tg/auto/send">取消</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
