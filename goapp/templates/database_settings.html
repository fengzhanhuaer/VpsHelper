<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        .progress-card { display:none; margin-top:14px; padding:12px; border-radius:12px; border:1px solid #ecd7cb; background:#fff8f3; }
        .progress-bar { width:100%; height:10px; border-radius:999px; background:#f1dfd2; overflow:hidden; margin:8px 0 6px; }
        .progress-fill { height:100%; width:0; background:linear-gradient(90deg,#ff9f66 0%,#d9480f 100%); transition:width 0.3s ease; }
        .progress-log { margin:8px 0 0; padding:8px 10px; max-height:160px; overflow:auto; border-radius:10px; border:1px solid #f0dccc; background:#fff; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>数据库管理</h1>
            <p class="muted">默认使用本地 sqlite。可创建云端私有 D1，并手动备份/拉取。</p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            <form id="db-settings-form" method="post" action="/settings/database">
                <div class="field">
                    <label for="cf_api_token">Cloudflare API Token</label>
                    <input id="cf_api_token" name="cf_api_token" value="{{ .CFToken }}" />
                </div>
                <div class="field">
                    <label>D1 数据库名称（固定）</label>
                    <input value="{{ .DBName }}" readonly />
                </div>
                <div class="field">
                    <label>D1 数据库 ID</label>
                    <input value="{{ .DBID }}" readonly />
                </div>
                <div style="display:grid; gap:8px;">
                    <button class="btn" type="submit" name="action" value="save">保存 Token</button>
                    <button class="ghost" type="submit" name="action" value="create">自动创建/绑定 {{ .DBName }} 数据库</button>
                </div>
            </form>

            <hr style="border:none; border-top:1px solid #eee; margin:18px 0;" />

            <h2 style="margin:0 0 10px; font-size:16px;">手动备份 / 拉取</h2>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button id="db-backup-btn" class="ghost" type="button">备份本地 → 云端 D1</button>
                <button id="db-pull-btn" class="ghost" type="button">云端 D1 → 拉取到本地</button>
            </div>

            <div id="db-progress-card" class="progress-card">
                <div id="db-progress-text" class="muted">准备中...</div>
                <div class="progress-bar"><div id="db-progress-fill" class="progress-fill"></div></div>
                <div id="db-progress-percent" class="muted">0%</div>
                <div id="db-progress-log" class="progress-log"></div>
            </div>

            <hr style="border:none; border-top:1px solid #eee; margin:18px 0;" />

            <h2 style="margin:0 0 10px; font-size:16px;">自动备份</h2>
            <form method="post" action="/settings/database">
                <div class="field" style="display:flex; align-items:center; gap:8px;">
                    <input id="db_auto_backup_enabled" name="db_auto_backup_enabled" type="checkbox" {{ if .AutoBackupEnabled }}checked{{ end }} style="width:auto;" />
                    <label for="db_auto_backup_enabled" style="margin:0;">启用每天自动备份</label>
                </div>
                <div class="field">
                    <label for="db_auto_backup_time">每日备份时间（HH:MM）</label>
                    <input id="db_auto_backup_time" name="db_auto_backup_time" value="{{ .AutoBackupTime }}" placeholder="03:30" />
                </div>
                <button class="ghost" type="submit" name="action" value="auto_backup">保存自动备份设置</button>
            </form>

            {{ if .LastAutoBackupResult }}
            <p class="muted" style="margin-top:12px;">最近自动备份：{{ .LastAutoBackupResult }}</p>
            {{ end }}
        </section>
    </main>

    <script>
    (function () {
        var card    = document.getElementById('db-progress-card');
        var textEl  = document.getElementById('db-progress-text');
        var fillEl  = document.getElementById('db-progress-fill');
        var pctEl   = document.getElementById('db-progress-percent');
        var logEl   = document.getElementById('db-progress-log');
        var backupBtn = document.getElementById('db-backup-btn');
        var pullBtn   = document.getElementById('db-pull-btn');

        function setProgress(pct, msg) {
            var p = Math.max(0, Math.min(100, Number(pct) || 0));
            fillEl.style.width = p + '%';
            pctEl.textContent  = p + '%';
            if (msg) textEl.textContent = msg;
        }

        function appendLog(msg) {
            if (!msg) return;
            var now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            logEl.textContent += '[' + now + '] ' + msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setBusy(busy) {
            backupBtn.disabled = busy;
            pullBtn.disabled   = busy;
            backupBtn.textContent = busy ? '操作中...' : '备份本地 → 云端 D1';
            pullBtn.textContent   = busy ? '操作中...' : '云端 D1 → 拉取到本地';
        }

        async function runStream(url, startLabel) {
            card.style.display = 'block';
            logEl.textContent  = '';
            setProgress(0, startLabel);
            appendLog(startLabel);
            setBusy(true);

            try {
                var res = await fetch(url, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/x-ndjson' }
                });
                if (!res.ok || !res.body) {
                    throw new Error('请求失败（HTTP ' + res.status + '）');
                }

                var reader  = res.body.getReader();
                var decoder = new TextDecoder();
                var buffer  = '';
                var finished = false;

                while (true) {
                    var part = await reader.read();
                    if (part.done) break;
                    buffer += decoder.decode(part.value, { stream: true });
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (var i = 0; i < lines.length; i++) {
                        var row = lines[i].trim();
                        if (!row) continue;
                        var ev;
                        try { ev = JSON.parse(row); } catch (_) { continue; }
                        setProgress(ev.percent, ev.message);
                        appendLog(ev.message);
                        if (ev.done) {
                            finished = true;
                            if (!ev.ok) appendLog('操作失败，请根据日志检查配置。');
                            break;
                        }
                    }
                    if (finished) break;
                }
                if (!finished) appendLog('连接已结束，请刷新页面。');
            } catch (err) {
                appendLog(err && err.message ? err.message : '请求出错');
                setProgress(0, '请求出错');
            } finally {
                setBusy(false);
            }
        }

        backupBtn.addEventListener('click', function () {
            runStream('/settings/database/backup/stream', '开始备份到云端 D1...');
        });
        pullBtn.addEventListener('click', function () {
            runStream('/settings/database/pull/stream', '开始从云端 D1 拉取...');
        });
    })();
    </script>
</body>
</html>
