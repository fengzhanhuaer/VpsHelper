<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
    <style>
        .progress-card { display:none; margin-top:14px; padding:12px; border-radius:12px; border:1px solid #ecd7cb; background:#fff8f3; }
        .progress-bar { width:100%; height:10px; border-radius:999px; background:#f1dfd2; overflow:hidden; margin:8px 0 6px; }
        .progress-fill { height:100%; width:0; background:linear-gradient(90deg,#ff9f66 0%,#d9480f 100%); transition:width 0.3s ease; }
        .progress-log { margin:8px 0 0; padding:8px 10px; max-height:160px; overflow:auto; border-radius:10px; border:1px solid #f0dccc; background:#fff; font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>数据库管理</h1>
            <p class="muted">默认使用本地 sqlite。可创建云端私有 D1，并手动备份/拉取。</p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            <form id="db-settings-form" method="post" action="/settings/database">
                <div class="field">
                    <label for="cf_api_token">Cloudflare API Token</label>
                    <input id="cf_api_token" name="cf_api_token" value="{{ .CFToken }}" />
                </div>
                <div class="field">
                    <label for="cf_d1_database_name">D1 云端数据库名称</label>
                    <input id="cf_d1_database_name" name="cf_d1_database_name" value="{{ .D1Name }}" placeholder="VpsHelper" />
                </div>
                <div class="field">
                    <label>本地数据库文件名（固定）</label>
                    <input value="{{ .DBName }}" readonly style="color:#999;" />
                </div>
                <div class="field">
                    <label>D1 数据库 ID</label>
                    <input value="{{ .DBID }}" readonly />
                </div>
                <div style="display:grid; gap:8px;">
                    <button class="btn" type="submit" name="action" value="save">保存配置</button>
                    <button class="ghost" type="submit" name="action" value="create">自动创建/绑定 {{ .D1Name }} 数据库</button>
                </div>
            </form>

            <hr style="border:none; border-top:1px solid #eee; margin:18px 0;" />

            <h2 style="margin:0 0 10px; font-size:16px;">手动备份 / 拉取</h2>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button id="db-backup-btn" class="ghost" type="button">备份本地 → 云端 D1</button>
                <button id="db-pull-btn" class="ghost" type="button">云端 D1 → 拉取到本地</button>
            </div>

            <div id="db-progress-card" class="progress-card">
                <div id="db-progress-text" class="muted">准备中...</div>
                <div class="progress-bar"><div id="db-progress-fill" class="progress-fill"></div></div>
                <div id="db-progress-percent" class="muted">0%</div>
                <div id="db-progress-log" class="progress-log"></div>
            </div>

            <hr style="border:none; border-top:1px solid #eee; margin:18px 0;" />

            <h2 style="margin:0 0 10px; font-size:16px;">自动备份</h2>
            <form method="post" action="/settings/database">
                <div class="field" style="display:flex; align-items:center; gap:8px;">
                    <input id="db_auto_backup_enabled" name="db_auto_backup_enabled" type="checkbox" {{ if .AutoBackupEnabled }}checked{{ end }} style="width:auto;" />
                    <label for="db_auto_backup_enabled" style="margin:0;">启用每天自动备份</label>
                </div>
                <div class="field">
                    <label for="db_auto_backup_time">每日备份时间（HH:MM）</label>
                    <input id="db_auto_backup_time" name="db_auto_backup_time" value="{{ .AutoBackupTime }}" placeholder="03:30" />
                </div>
                <button class="ghost" type="submit" name="action" value="auto_backup">保存自动备份设置</button>
            </form>

            {{ if .LastAutoBackupResult }}
            <p class="muted" style="margin-top:12px;">最近自动备份：{{ .LastAutoBackupResult }}</p>
            {{ end }}

            <hr style="border:none; border-top:1px solid #eee; margin:18px 0;" />

            <!-- ── 查看表数据 ─────────────────────────────────── -->
            <h2 style="margin:0 0 12px; font-size:16px;">查看表数据</h2>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
                <select id="db-table-select" style="flex:1; min-width:160px; padding:10px 12px; border-radius:10px; border:1px solid #ddd; font:inherit; box-sizing:border-box;">
                    <option value="">-- 选择表 --</option>
                    <option value="tg_accounts">tg_accounts</option>
                    <option value="tg_dialogs">tg_dialogs</option>
                    <option value="tg_sign_tasks">tg_sign_tasks</option>
                    <option value="tg_auto_send_tasks">tg_auto_send_tasks</option>
                    <option value="tg_login_flows">tg_login_flows</option>
                    <option value="app_settings">app_settings</option>
                </select>
                <button id="db-view-btn" class="btn" type="button" style="white-space:nowrap;">查询数据</button>
            </div>

            <div id="db-table-status" class="muted" style="margin-bottom:8px; display:none;"></div>
            <div id="db-table-error" class="error" style="display:none;"></div>

            <div id="db-table-wrapper" style="display:none; overflow-x:auto; border-radius:10px; border:1px solid #eee;">
                <table id="db-table-view" style="min-width:600px; font-size:13px;">
                    <thead id="db-table-head"></thead>
                    <tbody id="db-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
    (function () {
        /* ── 备份 / 拉取进度 ──────────────────────────────────── */
        var card      = document.getElementById('db-progress-card');
        var textEl    = document.getElementById('db-progress-text');
        var fillEl    = document.getElementById('db-progress-fill');
        var pctEl     = document.getElementById('db-progress-percent');
        var logEl     = document.getElementById('db-progress-log');
        var backupBtn = document.getElementById('db-backup-btn');
        var pullBtn   = document.getElementById('db-pull-btn');

        function setProgress(pct, msg) {
            var p = Math.max(0, Math.min(100, Number(pct) || 0));
            fillEl.style.width = p + '%';
            pctEl.textContent  = p + '%';
            if (msg) textEl.textContent = msg;
        }

        function appendLog(msg) {
            if (!msg) return;
            var now = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            logEl.textContent += '[' + now + '] ' + msg + '\n';
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setBusy(busy) {
            backupBtn.disabled = busy;
            pullBtn.disabled   = busy;
            backupBtn.textContent = busy ? '操作中...' : '备份本地 → 云端 D1';
            pullBtn.textContent   = busy ? '操作中...' : '云端 D1 → 拉取到本地';
        }

        async function runStream(url, startLabel) {
            card.style.display = 'block';
            logEl.textContent  = '';
            setProgress(0, startLabel);
            appendLog(startLabel);
            setBusy(true);

            try {
                var res = await fetch(url, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Accept': 'application/x-ndjson' }
                });
                if (!res.ok || !res.body) {
                    throw new Error('请求失败（HTTP ' + res.status + '）');
                }

                var reader   = res.body.getReader();
                var decoder  = new TextDecoder();
                var buffer   = '';
                var finished = false;

                while (true) {
                    var part = await reader.read();
                    if (part.done) break;
                    buffer += decoder.decode(part.value, { stream: true });
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (var i = 0; i < lines.length; i++) {
                        var row = lines[i].trim();
                        if (!row) continue;
                        var ev;
                        try { ev = JSON.parse(row); } catch (_) { continue; }
                        setProgress(ev.percent, ev.message);
                        appendLog(ev.message);
                        if (ev.done) {
                            finished = true;
                            if (!ev.ok) appendLog('操作失败，请根据日志检查配置。');
                            break;
                        }
                    }
                    if (finished) break;
                }
                if (!finished) appendLog('连接已结束，请刷新页面。');
            } catch (err) {
                appendLog(err && err.message ? err.message : '请求出错');
                setProgress(0, '请求出错');
            } finally {
                setBusy(false);
            }
        }

        backupBtn.addEventListener('click', function () {
            runStream('/settings/database/backup/stream', '开始备份到云端 D1...');
        });
        pullBtn.addEventListener('click', function () {
            runStream('/settings/database/pull/stream', '开始从云端 D1 拉取...');
        });

        /* ── 查看表数据 ───────────────────────────────────────── */
        var viewBtn     = document.getElementById('db-view-btn');
        var tableSelect = document.getElementById('db-table-select');
        var statusEl    = document.getElementById('db-table-status');
        var errorEl     = document.getElementById('db-table-error');
        var wrapper     = document.getElementById('db-table-wrapper');
        var thead       = document.getElementById('db-table-head');
        var tbody       = document.getElementById('db-table-body');

        function esc(v) {
            if (v === null || v === undefined) {
                return '<span style="color:#bbb;font-style:italic;">NULL</span>';
            }
            return String(v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        viewBtn.addEventListener('click', async function () {
            var table = tableSelect.value;
            if (!table) {
                errorEl.textContent = '请先选择一个表。';
                errorEl.style.display = 'block';
                return;
            }
            errorEl.style.display  = 'none';
            wrapper.style.display  = 'none';
            statusEl.textContent   = '加载中...';
            statusEl.style.display = 'block';
            viewBtn.disabled       = true;

            try {
                var res  = await fetch('/settings/database/table/data?table=' + encodeURIComponent(table), {
                    credentials: 'same-origin'
                });
                var data = await res.json();

                if (!data.ok) {
                    errorEl.textContent   = '查询失败：' + (data.error || '未知错误');
                    errorEl.style.display = 'block';
                    statusEl.style.display = 'none';
                    return;
                }

                var cols = data.columns || [];
                var rows = data.rows    || [];

                /* 构建表头 */
                var hHTML = '<tr><th style="padding:8px 10px;color:var(--muted);font-weight:600;">#</th>';
                cols.forEach(function (col) {
                    hHTML += '<th style="padding:8px 10px;color:var(--muted);font-weight:600;white-space:nowrap;">' + esc(col) + '</th>';
                });
                hHTML += '</tr>';
                thead.innerHTML = hHTML;

                /* 构建表体 */
                if (rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="' + (cols.length + 1) +
                        '" style="text-align:center;color:#aaa;padding:20px;">（表为空）</td></tr>';
                } else {
                    var bHTML = '';
                    rows.forEach(function (row, idx) {
                        bHTML += '<tr style="' + (idx % 2 === 0 ? 'background:#fafafa;' : '') + '">';
                        bHTML += '<td style="padding:7px 10px;color:#bbb;font-size:12px;">' + (idx + 1) + '</td>';
                        cols.forEach(function (col) {
                            var val     = row[col];
                            var display = esc(val);
                            if (typeof val === 'string' && val.length > 80) {
                                display = '<span title="' + val.replace(/"/g, '&quot;') + '">' +
                                          esc(val.substring(0, 80)) + '<span style="color:#aaa;">…</span></span>';
                            }
                            bHTML += '<td style="padding:7px 10px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + display + '</td>';
                        });
                        bHTML += '</tr>';
                    });
                    tbody.innerHTML = bHTML;
                }

                statusEl.textContent = '表：' + table + '　共 ' + rows.length + ' 行' +
                    (rows.length >= 500 ? '（最多显示 500 行）' : '');
                wrapper.style.display = 'block';

            } catch (err) {
                errorEl.textContent   = '请求出错：' + (err && err.message ? err.message : String(err));
                errorEl.style.display = 'block';
                statusEl.style.display = 'none';
            } finally {
                viewBtn.disabled = false;
            }
        });

        /* 切换表时自动清空旧结果 */
        tableSelect.addEventListener('change', function () {
            wrapper.style.display  = 'none';
            statusEl.style.display = 'none';
            errorEl.style.display  = 'none';
            thead.innerHTML = '';
            tbody.innerHTML = '';
        });
    })();
    </script>
</body>
</html>
