<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>数据库管理</h1>
            <p class="muted">默认使用本地 sqlite。可创建云端私有 D1，并手动备份/拉取。</p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            <form id="db-settings-form" method="post" action="/settings/database">
                <div class="field">
                    <label for="cf_api_token">Cloudflare API Token</label>
                    <input id="cf_api_token" name="cf_api_token" value="{{ .CFToken }}" />
                </div>
                <div class="field">
                    <label>D1 数据库名称（固定）</label>
                    <input value="{{ .DBName }}" readonly />
                </div>
                <div class="field">
                    <label>D1 数据库 ID</label>
                    <input value="{{ .DBID }}" readonly />
                </div>
                <div style="display:grid; gap:8px;">
                    <button class="btn" type="submit" name="action" value="save">保存 Token</button>
                    <button class="ghost" type="submit" name="action" value="create">自动创建/绑定 {{ .DBName }} 数据库</button>
                </div>
            </form>

            <form id="db-backup-form" method="post" action="/settings/database" style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <input type="hidden" name="action" value="backup" />
                <input type="hidden" name="do_backup" value="1" />
                <button id="db-backup-btn" class="ghost" type="submit">备份本地数据库到云端 D1</button>
                <span id="db-backup-status" class="muted" style="display:none;">正在备份到 D1，可能需要 10-120 秒，请勿重复点击。</span>
            </form>

            <form id="db-pull-form" method="post" action="/settings/database" style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                <input type="hidden" name="action" value="pull" />
                <input type="hidden" name="do_pull" value="1" />
                <button id="db-pull-btn" class="ghost" type="submit">将云端 D1 数据库拉取到本地</button>
                <span id="db-pull-status" class="muted" style="display:none;">正在从 D1 拉取数据，可能需要 10-120 秒，请勿重复点击。</span>
            </form>

            <form method="post" action="/settings/database" style="margin-top:14px;">
                <div class="field" style="display:flex; align-items:center; gap:8px;">
                    <input id="db_auto_backup_enabled" name="db_auto_backup_enabled" type="checkbox" {{ if .AutoBackupEnabled }}checked{{ end }} style="width:auto;" />
                    <label for="db_auto_backup_enabled" style="margin:0;">启用每天自动备份</label>
                </div>
                <div class="field">
                    <label for="db_auto_backup_time">每日备份时间（HH:MM）</label>
                    <input id="db_auto_backup_time" name="db_auto_backup_time" value="{{ .AutoBackupTime }}" placeholder="03:30" />
                </div>
                <button class="ghost" type="submit" name="action" value="auto_backup">保存自动备份设置</button>
            </form>

            {{ if .LastAutoBackupResult }}
            <p class="muted" style="margin-top:12px;">最近自动备份：{{ .LastAutoBackupResult }}</p>
            {{ end }}
        </section>
    </main>

    <script>
    (function () {
        var backupForm = document.getElementById('db-backup-form');
        var backupBtn = document.getElementById('db-backup-btn');
        var backupStatus = document.getElementById('db-backup-status');
        if (backupForm && backupBtn && backupStatus) {
            backupForm.addEventListener('submit', function (event) {
                if (backupForm.dataset.submitting === '1') {
                    event.preventDefault();
                    return;
                }
                backupForm.dataset.submitting = '1';
                backupBtn.textContent = '备份中...';
                backupStatus.style.display = 'inline';
            });
        }

        var pullForm = document.getElementById('db-pull-form');
        var pullBtn = document.getElementById('db-pull-btn');
        var pullStatus = document.getElementById('db-pull-status');
        if (pullForm && pullBtn && pullStatus) {
            pullForm.addEventListener('submit', function (event) {
                if (pullForm.dataset.submitting === '1') {
                    event.preventDefault();
                    return;
                }
                pullForm.dataset.submitting = '1';
                pullBtn.textContent = '拉取中...';
                pullStatus.style.display = 'inline';
            });
        }
    })();
    </script>
</body>
</html>
