<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
    <style>
        .content-frame {
            width: 100%;
            border: none;
            background: transparent;
            min-height: 85vh;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/probe/nodes">探针管理</a>
            <a class="ghost" href="/probe/dashboard" style="color:var(--color-primary); font-weight:bold;">探针监视</a>
            <a class="ghost" href="/home" target="_blank">主页</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main style="max-width: 1200px;">
        <section class="panel panel--wide" style="max-width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 style="margin: 0; display: flex; align-items: center;">
                        <select id="view-switcher" onchange="switchView(this.value)"
                            style="font-family: inherit; font-size: inherit; font-weight: inherit; border: none; background: transparent; cursor: pointer; outline: none; padding: 0; color: inherit; appearance: auto;">
                            {{ $isNet := eq .Tab "netstatus" }}
                            <option value="status" {{ if not $isNet }}selected{{ end }}>探针状态</option>
                            <option value="netstatus" {{ if $isNet }}selected{{ end }}>网络状态</option>
                        </select>
                    </h1>
                    <p class="muted" id="view-desc">{{ if eq .Tab "netstatus" }}实时监控各探针执行 Ping 任务的网络丢包与延迟曲线{{ else }}实时监控所有在线节点的系统负载与网络情况{{ end }}</p>
                </div>
                <div style="margin-bottom: 16px; font-size: 0.9em; color: var(--color-text-muted);">
                    <span id="update-timer-outer"></span>
                </div>
            </div>

            {{ $isNet := eq .Tab "netstatus" }}
            <iframe id="content-frame" name="dashboard_frame" class="content-frame"
                src="/probe/dashboard?content={{ if $isNet }}netstatus{{ else }}status{{ end }}"
                onload="onFrameLoad(this)">
            </iframe>
        </section>
    </main>

    <script>
        const descriptions = {
            'status': '实时监控所有在线节点的系统负载与网络情况',
            'netstatus': '实时监控各探针执行 Ping 任务的网络丢包与延迟曲线'
        };

        function switchView(value) {
            const frame = document.getElementById('content-frame');
            frame.src = '/probe/dashboard?content=' + value;
            document.getElementById('view-desc').textContent = descriptions[value] || '';
            // Update URL without reload so browser history is correct
            history.replaceState(null, '', '/probe/dashboard?tab=' + value);
        }

        function onFrameLoad(obj) {
            try {
                const frameBody = obj.contentWindow.document.body;
                if (frameBody) {
                    obj.style.height = (frameBody.scrollHeight + 50) + 'px';
                }
            } catch (e) {}
        }

        // Periodically resize iframe to fit content
        window.setInterval(function () {
            onFrameLoad(document.getElementById('content-frame'));
        }, 1000);
    </script>
</body>
</html>
