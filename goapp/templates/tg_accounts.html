<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/tg_helper">返回 Tg 助手</a>
            <a class="ghost" href="/home">返回主页</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main>
        <section class="panel">
            <h1>TG 账号管理</h1>
            <p class="muted">本页支持：重新登录（仅更新 Session）、删除账号。</p>

            {{ if .Message }}
            <div class="{{ if .MsgOK }}success{{ else }}error{{ end }}">{{ .Message }}</div>
            {{ end }}

            <div style="margin:12px 0;">
                <a class="btn" href="/tg/login/start">添加账号（登录）</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>账号名</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                {{ range .Accounts }}
                    <tr>
                        <td>{{ .ID }}</td>
                        <td>{{ .AccountName }}</td>
                        <td>{{ .CreatedAt }}</td>
                        <td>
                            <a class="ghost" href="/tg/accounts/relogin?account_id={{ .ID }}" style="margin-right:6px;">重新登录</a>
                            <form method="post" action="/tg/accounts" style="display:inline;">
                                <input type="hidden" name="id" value="{{ .ID }}" />
                                <button class="ghost" type="submit" name="action" value="delete" onclick="return confirm('确定删除该账号会话吗？');">删除</button>
                            </form>
                        </td>
                    </tr>
                {{ else }}
                    <tr><td colspan="4" class="muted">暂无账号</td></tr>
                {{ end }}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
