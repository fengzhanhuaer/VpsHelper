<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/static/style.css?v=0236" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <strong>VpsHelper</strong>
        <nav>
            <a class="ghost" href="/probe/nodes">探针节点</a>
            <a class="ghost" href="/probe/tasks">拨测任务</a>
            <a class="ghost" href="/probe/dashboard">探针状态</a>
            <a class="ghost" href="/probe/pings" style="color:var(--color-primary); font-weight:bold;">拨测监控</a>
            <a class="ghost" href="/home">返回主菜单</a>
            <a class="ghost" href="/logout">退出登录</a>
        </nav>
    </header>

    <main style="max-width: 1200px;">
        <section class="panel panel--wide" style="max-width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1>拨测监控</h1>
                    <p class="muted">实时监控各探针执行 Ping 任务的网络丢包与延迟曲线</p>
                </div>
                <div style="margin-bottom: 16px; font-size: 0.9em; color: var(--color-text-muted);">
                    <span id="update-timer">就绪</span>
                </div>
            </div>

            {{ if eq (len .Nodes) 0 }}
                <div class="card" style="text-align: center; padding: 40px;">
                    <p class="muted" style="margin-bottom: 20px;">系统目前没有任何探针节点。</p>
                </div>
            {{ else }}
                <div id="ping-charts-container" style="display: flex; flex-direction: column; gap: 24px;">
                    <div class="muted" style="text-align: center; padding: 40px;">初始化中...</div>
                </div>
            {{ end }}
        </section>
    </main>

    <script>
        const tasksMap = {};
        {{ range .Tasks }}
            tasksMap["{{ .ID }}"] = "{{ .Name }} ({{ .Target }})";
        {{ end }}

        const nodesList = [];
        {{ range .Nodes }}
            nodesList.push({ id: {{ .ID }}, name: "{{ .Name }}", vendor: "{{ .Vendor }}", vendorUrl: "{{ .VendorUrl }}" });
        {{ end }}

        const chartInstances = {};
        const nodeContainers = {};
        let currentWs = null;

        const colors = [
            '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
            '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
        ];

        async function initDashboard() {
            if (nodesList.length === 0) return;

            const container = document.getElementById('ping-charts-container');
            container.innerHTML = '';

            for (const node of nodesList) {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.position = 'relative';
                card.style.height = '420px'; // Give enough height for legend and chart
                card.style.marginBottom = '24px';
                
                const title = document.createElement('h3');
                title.style.marginTop = '0';
                let titleHtml = node.name;
                if (node.vendor) {
                    if (node.vendorUrl) {
                        titleHtml += ` (<a href="${node.vendorUrl}" target="_blank" style="color: var(--color-primary); text-decoration: underline;">${node.vendor}</a>)`;
                    } else {
                        titleHtml += ` (${node.vendor})`;
                    }
                }
                title.innerHTML = titleHtml;
                card.appendChild(title);

                const statusBox = document.createElement('div');
                statusBox.className = 'muted';
                statusBox.textContent = '加载中...';
                card.appendChild(statusBox);

                const chartContainer = document.createElement('div');
                chartContainer.style.position = 'relative';
                chartContainer.style.height = '350px';
                chartContainer.style.width = '100%';
                card.appendChild(chartContainer);

                const canvas = document.createElement('canvas');
                canvas.id = 'chart-node-' + node.id;
                canvas.style.display = 'none';
                chartContainer.appendChild(canvas);
                
                container.appendChild(card);
                nodeContainers[node.id] = { card, statusBox, canvas, taskMapping: {} };
                
                loadPingHistory(node.id);
            }
            connectWS();
        }

        async function loadPingHistory(nodeId) {
            try {
                const res = await fetch('/api/probe/ping_history?hours=24&node_id=' + nodeId);
                const data = await res.json();
                
                const nc = nodeContainers[nodeId];

                if (!data.history || Object.keys(data.history).length === 0) {
                    nc.statusBox.textContent = '当前探针在最近24小时内没有任何历史拨测数据。原因是节点尚未分配任务，或处于离线状态。';
                    return;
                }
                
                nc.statusBox.style.display = 'none';
                nc.canvas.style.display = 'block';

                const datasets = [];
                let labels = [];

                let colorIdx = 0;
                for (const taskId in data.history) {
                    const points = data.history[taskId];
                    const taskLabel = tasksMap[taskId] || ("未知任务 ID:" + taskId);
                    
                    if (labels.length === 0) {
                        labels = points.map(p => {
                            const d = new Date(p.created_at * 1000);
                            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
                        });
                    }

                    const latencies = points.map(p => p.latency);
                    const losses = points.map(p => p.loss);
                    
                    const color = colors[colorIdx % colors.length];

                    datasets.push({
                        label: `${taskLabel} - 延迟(ms)`,
                        data: latencies,
                        borderColor: color,
                        backgroundColor: color, // For legend
                        yAxisID: 'y',
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHitRadius: 10,
                        tension: 0.1,
                        fill: false
                    });
                    datasets.push({
                        label: `${taskLabel} - 丢包(%)`,
                        data: losses,
                        borderColor: color,
                        backgroundColor: color, // For legend
                        borderDash: [5, 5], 
                        yAxisID: 'y1',
                        borderWidth: 1,
                        pointRadius: 0,
                        pointHitRadius: 10,
                        stepped: true,
                        fill: false,
                        hidden: false // show by default
                    });
                    
                    nc.taskMapping[taskId] = { 
                        datasetLatencyIdx: datasets.length - 2, 
                        datasetLossIdx: datasets.length - 1 
                    };

                    colorIdx++;
                }

                const ctx = nc.canvas.getContext('2d');
                chartInstances[nodeId] = new Chart(ctx, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { ticks: { maxTicksLimit: 20 } },
                            y: {
                                type: 'linear', display: true, position: 'left',
                                title: { display: true, text: '延迟 (ms)' },
                                min: 0, suggestedMax: 200
                            },
                            y1: {
                                type: 'linear', display: true, position: 'right',
                                title: { display: true, text: '丢包率 (%)' },
                                grid: { drawOnChartArea: false },
                                min: 0, max: 100
                            },
                        }
                    }
                });
            } catch (e) {
                const nc = nodeContainers[nodeId];
                nc.statusBox.textContent = '加载历史数据失败: ' + e.message;
            }
        }

        function connectWS() {
            if (currentWs) {
                currentWs.close(); 
            }
            const wsScheme = window.location.protocol === "https:" ? "wss://" : "ws://";
            const wsUrl = wsScheme + window.location.host + "/probe/ws";
            const ws = new WebSocket(wsUrl);
            currentWs = ws;
            const statusBox = document.getElementById('update-timer');

            ws.onopen = () => {
                statusBox.textContent = "🟢 实时数据通道连接成功";
                statusBox.style.color = "#28a745";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === "ping_results") {
                    const nodeId = data.node_id;
                    const chart = chartInstances[nodeId];
                    const nc = nodeContainers[nodeId];
                    if (chart && nc && data.results) {
                        const now = new Date();
                        const timeLabel = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                        
                        chart.data.labels.push(timeLabel);
                        if (chart.data.labels.length > 200) {
                            chart.data.labels.shift();
                        }
                        
                        const mapping = nc.taskMapping;
                        
                        for (let tId in mapping) {
                            const res = data.results[tId];
                            const idxLat = mapping[tId].datasetLatencyIdx;
                            const idxLoss = mapping[tId].datasetLossIdx;
                            
                            if (res) {
                                chart.data.datasets[idxLat].data.push(res.latency);
                                chart.data.datasets[idxLoss].data.push(res.loss);
                            } else {
                                chart.data.datasets[idxLat].data.push(null);
                                chart.data.datasets[idxLoss].data.push(null);
                            }
                            
                            if (chart.data.datasets[idxLat].data.length > 200) {
                                chart.data.datasets[idxLat].data.shift();
                                chart.data.datasets[idxLoss].data.shift();
                            }
                        }
                        chart.update('none');
                    }
                }
            };

            ws.onclose = () => {
                statusBox.textContent = "🔴 连接已断开，由于这是次级页面，不会立即重连。";
                statusBox.style.color = "#dc3545";
            };

            ws.onerror = (err) => {
                console.error("WS error:", err);
            };
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
