<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>NetHelper — 网络连接查看器</title>
    <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
<div id="app">
    <!-- 侧边导航栏 -->
    <nav id="sidebar">
        <div class="brand">
            <span class="brand-icon">🌐</span>
            <span class="brand-name">NetHelper</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item" data-target="dashboard">
                <span class="nav-icon">🏠</span> 概览
            </li>
            <li class="nav-item" data-target="proxies">
                <span class="nav-icon">🌐</span> 节点配置
            </li>
            <li class="nav-item active" data-target="connections">
                <span class="nav-icon">📈</span> 活动连接
            </li>
            <li class="nav-item" data-target="settings">
                <span class="nav-icon">⚙️</span> 系统设置
            </li>
        </ul>
        <div class="sidebar-footer">
            <div class="global-status">
                <span id="global-status-dot" class="status-dot ok"></span>
                <span id="global-status-text" class="status-text">系统直连中</span>
            </div>
        </div>
    </nav>

    <!-- 右侧动态内容区 -->
    <div id="main-content">
        <!-- 路由视图将挂载于此 -->
    </div>
</div>

<!-- ================= 模板区 ================= -->

<!-- Dashboard 模板 -->
<template id="tpl-dashboard">
    <header class="topbar">
        <div class="view-title">概览 Dashboard</div>
    </header>
    <main class="view-body dashboard-body">
        <h2 style="color:var(--text-primary); margin-bottom:10px;">系统状态</h2>
        <p style="color:var(--text-secondary);">等待流量统计模块接入...</p>
    </main>
</template>

<!-- Connections (F7) 模板 -->
<template id="tpl-connections">
    <header class="topbar">
        <div class="view-title">活动连接</div>
        <div class="toolbar">
            <input type="text" id="search-input" placeholder="搜索进程 / IP / 端口…" autocomplete="off"/>
            <label class="toggle-label">
                <input type="checkbox" id="toggle-udp" checked/>
                显示 UDP
            </label>
            <label class="toggle-label">
                <input type="checkbox" id="toggle-listen" checked/>
                显示 LISTEN
            </label>
        </div>
    </header>
    <main class="view-body">
        <div id="connection-panel">
            <div class="loading-overlay" id="loading">
                <div class="spinner"></div>
                <p>正在获取连接数据…</p>
            </div>
            <table id="conn-table">
                <thead>
                    <tr>
                        <th class="col-expand"></th>
                        <th class="col-proc" data-sort="procName">进程</th>
                        <th class="col-pid" data-sort="pid">PID</th>
                        <th class="col-proto" data-sort="protocol">协议</th>
                        <th class="col-local" data-sort="localAddr">本地地址</th>
                        <th class="col-remote" data-sort="remoteAddr">远端地址</th>
                        <th class="col-state" data-sort="state">状态</th>
                    </tr>
                </thead>
                <tbody id="conn-tbody"></tbody>
            </table>
            <div id="empty-hint" style="display:none" class="empty-hint">📭 暂无活动连接</div>
        </div>
    </main>
    <footer class="statusbar">
        <span id="conn-count">活动连接: —</span>
        <span id="proc-count">置顶常驻: 0 | 瞬时进程: —</span>
        <span id="last-update">上次采集: —</span>
    </footer>
</template>
<script src="./src/main.js" type="module"></script>
</body>
</html>
